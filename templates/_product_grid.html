<div class="menu-board">
  <div class="menu-grid">
    {% for p in products %}
    <a class="menu-card is-{{ p.status }}" href="{{ url_for('detail', pid=p.id) }}">
      <span class="badge badge--{{ p.status }}"><i class="dot"></i>{{ status_label[p.status] }}</span>
      <img src="{{ url_for('static', filename='images/' ~ p.img) }}" alt="{{ p.name }}" />
      <strong class="menu-card__name">{{ p.name }}</strong>
      <span class="menu-card__price">{{ p.price|won }}원</span>
    </a>
    {% endfor %}
  </div>

  <nav class="pager" aria-label="페이지 이동">
    <a class="pager__arrow {% if page <= 1 %}is-disabled{% endif %}"
       href="{{ url_for(page_endpoint, page=page-1) }}" aria-label="이전">◀</a>
    {% for n in range(1, total_pages + 1) %}
    <a class="pager__num {% if n == page %}is-current{% endif %}"
       href="{{ url_for(page_endpoint, page=n) }}">{{ n }}</a>
    {% endfor %}
    <a class="pager__arrow {% if page >= total_pages %}is-disabled{% endif %}"
       href="{{ url_for(page_endpoint, page=page+1) }}" aria-label="다음">▶</a>
  </nav>
</div>

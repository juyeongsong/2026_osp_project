
{% extends "base.html" %}

{% block body_class %}page-main{% endblock %}
{% block section_class %}main-layout{% endblock %}

{% block section %}

<nav class="main-menu">
  <a class="pill-btn" href="{{ url_for('detail', pid=products[0].id) if products else '#' }}">
    오늘의 붕어빵은?
  </a>

  <a class="pill-btn" href="{{ url_for('view_review') }}">
    후기 보기
  </a>

  {% if logged_in %}
  <div class="auth-links">
    <span class="hello">{{ user_id }}님</span>
    <a href="{{ url_for('logout') }}">로그아웃</a>
  </div>
  {% else %}
  <div class="auth-links">
    <a href="{{ url_for('signup') }}">회원가입</a>
    <span class="bar">|</span>
    <a href="{{ url_for('login') }}">로그인</a>
  </div>
  {% endif %}

</nav>

{% include "_product_grid.html" %}

{% endblock section %}

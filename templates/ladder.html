<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이화 붕어빵 - 오늘의 붕어빵은?</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/reg_pages.css') }}"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ladder.css') }}">
  </head>
  <body>
    <header class="site-top">
      <div class="awning">
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
      </div>

      <div class="site-logo">
        <a href="/">
          <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="이화 붕어빵"
          />
        </a>
      </div>

      <h1 class="page-title">오늘의 붕어빵은?</h1>

      <div class="header-icons">
        <a href="/" class="icon-btn">
          <img
            src="{{ url_for('static', filename='images/home.png') }}"
            alt="홈"
          />
        </a>
        <a href="#" class="icon-btn cart">
          <img
            src="{{ url_for('static', filename='images/cart.png') }}"
            alt="장바구니"
          />
        </a>
      </div>
    </header>

    <section>
      <div class="body-area">
        <div class="lead">
          <img
            class="fish"
            src="{{ url_for('static', filename='images/fish-base.png') }}"
            alt=""
          />뭐 먹을지 고민이 될 땐, 사다리를 타보세요~
        </div>

        <div class="board-wrap">
          <div class="start-row" id="startRow"></div>
          <svg id="ladderSvg"></svg>
          <div class="bottom-row" id="bottomRow"></div>
        </div>

        <div class="result-box" id="resultBox"></div>

        <div class="action-row">
          <button class="ladder-btn" id="ladderBtn">사다리 타기</button>
          <button class="reagain-btn" id="reagainBtn">다시 한 번</button>
        </div>
        <div class="hint">
          ※ 먼저 "사다리 타기"를 누른 뒤, 위쪽 숫자 중 하나를 골라주세요
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p>
        <span style="color: #006b2d">문의 상담 | 이화 붕어빵 </span>02)
        1886-0531
      </p>
    </footer>

    <script>
      (function () {
        const flavors = [
          "팥 붕어빵",
          "고구마 붕어빵",
          "딸기슈크림 붕어빵",
          "슈크림 붕어빵",
          "피자 붕어빵",
          "말차 붕어빵",
        ];
        const cardImgs = [
          "{{ url_for('static', filename='images/card-red-bean.png') }}",
          "{{ url_for('static', filename='images/card-sweet-potato.png') }}",
          "{{ url_for('static', filename='images/card-strawberry.png') }}",
          "{{ url_for('static', filename='images/card-cream.png') }}",
          "{{ url_for('static', filename='images/card-pizza.png') }}",
          "{{ url_for('static', filename='images/card-matcha.png') }}",
        ];
        const N = flavors.length;
        const ROWS = 7;
        const svgW = 1500;
        const SLICE = svgW / N;
        const ROW_H = 35;
        const svgH = ROWS * ROW_H;
        const FIXED_RUNGS = [[3], [1], [0, 4], [2], [1], [0], []];

        const startRow = document.getElementById("startRow");
        const bottomRow = document.getElementById("bottomRow");
        const svg = document.getElementById("ladderSvg");
        const resultBox = document.getElementById("resultBox");
        const ladderBtn = document.getElementById("ladderBtn");
        const reagainBtn = document.getElementById("reagainBtn");

        svg.setAttribute("width", svgW);
        svg.setAttribute("height", svgH);
        svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);

        let rungs = [];
        let usedStarts = new Set();
        let animating = false;
        let started = false;

        function colX(i) {
          return (i + 0.5) * SLICE;
        }

        function generateLadder() {
          rungs = FIXED_RUNGS.map((row) => row.slice());
        }

        function drawLadder() {
          svg.innerHTML = `
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.06" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
      </filter>
      <g id="linesGroup" filter="url(#wobble)"></g>
    `;
          const linesGroup = svg.querySelector("#linesGroup");
          for (let i = 0; i < N; i++) {
            const x = colX(i);
            const line = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );
            line.setAttribute("x1", x);
            line.setAttribute("y1", 0);
            line.setAttribute("x2", x);
            line.setAttribute("y2", svgH);
            line.setAttribute("class", "path-line");
            linesGroup.appendChild(line);
          }
          for (let r = 0; r < ROWS; r++) {
            const y = r * ROW_H + ROW_H / 2;
            rungs[r].forEach((c) => {
              const line = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
              );
              line.setAttribute("x1", colX(c));
              line.setAttribute("y1", y);
              line.setAttribute("x2", colX(c + 1));
              line.setAttribute("y2", y);
              line.setAttribute("class", "path-line");
              linesGroup.appendChild(line);
            });
          }
        }

        function buildRows() {
          startRow.innerHTML = "";
          bottomRow.innerHTML = "";
          for (let i = 0; i < N; i++) {
            const btn = document.createElement("button");
            btn.className = "start-btn-dot";
            btn.textContent = i + 1;
            btn.dataset.col = i;
            btn.disabled = true;
            btn.addEventListener("click", () => handleStart(i, btn));
            startRow.appendChild(btn);

            const card = document.createElement("div");
            card.className = "flavor-card-mini";
            card.innerHTML = `<img class="card-mini-img" data-col="${i}" src="${cardImgs[i]}" alt="${flavors[i]}">`;
            bottomRow.appendChild(card);
          }
        }

        function tracePathSegments(startCol) {
          const segs = [];
          let col = startCol,
            y = 0;
          for (let r = 0; r < ROWS; r++) {
            const rowY1 = r * ROW_H + ROW_H / 2;
            segs.push({ x1: colX(col), y1: y, x2: colX(col), y2: rowY1 });
            y = rowY1;
            if (rungs[r].includes(col)) {
              segs.push({ x1: colX(col), y1: y, x2: colX(col + 1), y2: y });
              col += 1;
            } else if (rungs[r].includes(col - 1)) {
              segs.push({ x1: colX(col), y1: y, x2: colX(col - 1), y2: y });
              col -= 1;
            }
          }
          segs.push({ x1: colX(col), y1: y, x2: colX(col), y2: svgH });
          return { segs, endCol: col };
        }

        function handleStart(col, btn) {
          if (!started || animating || usedStarts.has(col) || btn.disabled)
            return;
          animating = true;
          usedStarts.add(col);
          btn.disabled = true;
          btn.classList.add("used");
          resultBox.textContent = "";

          const { segs, endCol } = tracePathSegments(col);
          let i = 0;

          function step() {
            if (i >= segs.length) {
              animating = false;
              const bun = bottomRow.querySelector(
                `.card-mini-img[data-col="${endCol}"]`
              );
              bun.classList.add("winner");
              resultBox.textContent = `${col + 1}번 → ${
                flavors[endCol]
              } 당첨! 🎉`;
              return;
            }
            const s = segs[i];
            const line = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );
            line.setAttribute("x1", s.x1);
            line.setAttribute("y1", s.y1);
            line.setAttribute("x2", s.x1);
            line.setAttribute("y2", s.y1);
            line.setAttribute("class", "highlight-line");
            svg.appendChild(line);

            const duration = 110;
            const start = performance.now();
            function animate(now) {
              const t = Math.min(1, (now - start) / duration);
              line.setAttribute("x2", s.x1 + (s.x2 - s.x1) * t);
              line.setAttribute("y2", s.y1 + (s.y2 - s.y1) * t);
              if (t < 1) requestAnimationFrame(animate);
              else {
                i++;
                step();
              }
            }
            requestAnimationFrame(animate);
          }
          step();
        }

        function activateStart() {
          started = true;
          ladderBtn.textContent = "숫자를 골라보세요 ↑";
          ladderBtn.classList.add("started");
          ladderBtn.disabled = true;
          document.querySelectorAll(".start-btn-dot").forEach((b) => {
            if (!usedStarts.has(Number(b.dataset.col))) b.disabled = false;
          });
        }

        function resetAll() {
          usedStarts.clear();
          animating = false;
          started = false;
          resultBox.textContent = "";
          ladderBtn.textContent = "사다리 타기";
          ladderBtn.classList.remove("started");
          ladderBtn.disabled = false;
          generateLadder();
          drawLadder();
          buildRows();
        }

        ladderBtn.addEventListener("click", activateStart);
        reagainBtn.addEventListener("click", resetAll);

        resetAll();
      })();
    </script>
  </body>
</html>

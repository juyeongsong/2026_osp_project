<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이화 붕어빵 - 오늘의 붕어빵은?</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/reg_pages.css') }}"
    />
    <style>
      :root {
        --green: #00640f;
        --cream: #fbffe5;
        --page-yellow: #fff184;
        --accent: #9ed4b1;
        --input-bg: #fff9d0;
        --input-border: #7b95b7;
        --text: #123621;
        --line: #2b2b2b;
      }

      section {
        flex: 1;
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
      }

      .awning {
        margin-bottom: 70px;
      }
      .body-area {
        padding: 28px 48px 10px;
      }

      .page-title {
        left: 468px;
        top: 48px;
      }

      .lead {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-left: 4px;
        font-family: "OkDanDan", "Pretendard", sans-serif;
        font-size: 50px;
        font-weight: 700;
        color: var(--line);
        margin-bottom: 18px;
      }
      .lead .fish {
        width: 74px;
        height: 59.11px;
        display: block;
      }

      .board-wrap {
        background: rgba(255, 222, 121, 0.45);
        border-radius: 30px;
        padding: 20px 18px 24px;
        margin-bottom: 20px;
      }

      .start-row,
      .bottom-row {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        justify-items: center;
      }

      .start-btn-dot {
        width: 82px;
        height: 63px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 30px;
        background: #fbffe5;
        color: #000000;
        border: none;
        font-family: "OkDanDan", "Pretendard", sans-serif;
        font-weight: 700;
        font-size: 40px;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease,
          opacity 0.15s ease;
      }
      .start-btn-dot:disabled {
        background: #fbffe5;
        cursor: default;
      }
      .start-btn-dot:hover:not(:disabled) {
        background: #fbffe5;
        opacity: 0.85;
        transform: scale(1.08);
      }
      .start-btn-dot.used {
        opacity: 0.35;
      }

      svg {
        display: block;
        margin: 8px 0;
        width: 100%;
        height: auto;
      }
      .path-line {
        stroke: #000000;
        stroke-width: 4;
        fill: none;
      }
      .highlight-line {
        stroke: var(--green);
        stroke-width: 5;
        stroke-linecap: round;
        fill: none;
      }

      .flavor-card-mini {
        width: 140px;
        height: 170px;
        text-align: center;
      }
      .card-mini-img {
        width: 100%;
        height: 100%;
        display: block;
        transition: filter 0.2s ease, transform 0.2s ease;
      }
      .card-mini-img.winner {
        filter: drop-shadow(0 0 3px var(--accent))
          drop-shadow(0 0 3px var(--accent)) drop-shadow(0 0 8px var(--accent));
        transform: scale(1.06);
      }

      .result-box {
        margin-top: 16px;
        min-height: 30px;
        text-align: center;
        font-size: 1.1rem;
        font-weight: 800;
        color: var(--green);
      }

      .action-row {
        display: flex;
        align-items: center;
        gap: 93.68px;
        margin-left: 341px;
        padding-bottom: 20px;
      }

      .ladder-btn {
        width: 284.32px;
        height: 83px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--green);
        color: #fff;
        border: none;
        border-radius: 50px;
        font-family: "OkDanDan", "Pretendard", sans-serif;
        font-size: 40px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .ladder-btn:hover {
        background: var(--green);
        opacity: 0.85;
      }
      .ladder-btn.started {
        background: var(--green);
        opacity: 0.6;
      }

      .reagain-btn {
        width: 284.32px;
        height: 83px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        color: var(--line);
        border: none;
        border-radius: 50px;
        font-family: "OkDanDan", "Pretendard", sans-serif;
        font-size: 40px;
        font-weight: 700;
        cursor: pointer;
      }
      .reagain-btn:hover {
        background: var(--cream);
      }

      .hint {
        text-align: center;
        font-size: 20px;
        color: #8a9e8e;
        padding-bottom: 14px;
      } /* 글자 크기 = 상품 등록 .page-subtitle과 동일 */
    </style>
  </head>
  <body>
    <header class="site-top">
      <div class="awning">
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
      </div>

      <div class="site-logo">
        <a href="/">
          <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="이화 붕어빵"
          />
        </a>
      </div>

      <h1 class="page-title">오늘의 붕어빵은?</h1>

      <div class="header-icons">
        <a href="/" class="icon-btn">
          <img
            src="{{ url_for('static', filename='images/home.png') }}"
            alt="홈"
          />
        </a>
        <a href="#" class="icon-btn cart">
          <img
            src="{{ url_for('static', filename='images/cart.png') }}"
            alt="장바구니"
          />
        </a>
      </div>
    </header>

    <section>
      <div class="body-area">
        <div class="lead">
          <img
            class="fish"
            src="{{ url_for('static', filename='images/fish-base.png') }}"
            alt=""
          />뭐 먹을지 고민이 될 땐, 사다리를 타보세요~
        </div>

        <div class="board-wrap">
          <div class="start-row" id="startRow"></div>
          <svg id="ladderSvg"></svg>
          <div class="bottom-row" id="bottomRow"></div>
        </div>

        <div class="result-box" id="resultBox"></div>

        <div class="action-row">
          <button class="ladder-btn" id="ladderBtn">사다리 타기</button>
          <button class="reagain-btn" id="reagainBtn">다시 한 번</button>
        </div>
        <div class="hint">
          ※ 먼저 "사다리 타기"를 누른 뒤, 위쪽 숫자 중 하나를 골라주세요
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p>
        <span style="color: #006b2d">문의 상담 | 이화 붕어빵 </span>02)
        1886-0531
      </p>
    </footer>

    <script>
      (function () {
        const flavors = [
          "팥 붕어빵",
          "고구마 붕어빵",
          "딸기슈크림 붕어빵",
          "슈크림 붕어빵",
          "피자 붕어빵",
          "말차 붕어빵",
        ];
        const cardImgs = [
          "{{ url_for('static', filename='images/card-red-bean.png') }}",
          "{{ url_for('static', filename='images/card-sweet-potato.png') }}",
          "{{ url_for('static', filename='images/card-strawberry.png') }}",
          "{{ url_for('static', filename='images/card-cream.png') }}",
          "{{ url_for('static', filename='images/card-pizza.png') }}",
          "{{ url_for('static', filename='images/card-matcha.png') }}",
        ];
        const N = flavors.length;
        const ROWS = 7;
        const svgW = 1500;
        const SLICE = svgW / N;
        const ROW_H = 35;
        const svgH = ROWS * ROW_H;
        const FIXED_RUNGS = [[3], [1], [0, 4], [2], [1], [0], []];

        const startRow = document.getElementById("startRow");
        const bottomRow = document.getElementById("bottomRow");
        const svg = document.getElementById("ladderSvg");
        const resultBox = document.getElementById("resultBox");
        const ladderBtn = document.getElementById("ladderBtn");
        const reagainBtn = document.getElementById("reagainBtn");

        svg.setAttribute("width", svgW);
        svg.setAttribute("height", svgH);
        svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);

        let rungs = [];
        let usedStarts = new Set();
        let animating = false;
        let started = false;

        function colX(i) {
          return (i + 0.5) * SLICE;
        }

        function generateLadder() {
          rungs = FIXED_RUNGS.map((row) => row.slice());
        }

        function drawLadder() {
          svg.innerHTML = `
      <filter id="wobble">
        <feTurbulence type="fractalNoise" baseFrequency="0.01 0.06" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
      </filter>
      <g id="linesGroup" filter="url(#wobble)"></g>
    `;
          const linesGroup = svg.querySelector("#linesGroup");
          for (let i = 0; i < N; i++) {
            const x = colX(i);
            const line = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );
            line.setAttribute("x1", x);
            line.setAttribute("y1", 0);
            line.setAttribute("x2", x);
            line.setAttribute("y2", svgH);
            line.setAttribute("class", "path-line");
            linesGroup.appendChild(line);
          }
          for (let r = 0; r < ROWS; r++) {
            const y = r * ROW_H + ROW_H / 2;
            rungs[r].forEach((c) => {
              const line = document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
              );
              line.setAttribute("x1", colX(c));
              line.setAttribute("y1", y);
              line.setAttribute("x2", colX(c + 1));
              line.setAttribute("y2", y);
              line.setAttribute("class", "path-line");
              linesGroup.appendChild(line);
            });
          }
        }

        function buildRows() {
          startRow.innerHTML = "";
          bottomRow.innerHTML = "";
          for (let i = 0; i < N; i++) {
            const btn = document.createElement("button");
            btn.className = "start-btn-dot";
            btn.textContent = i + 1;
            btn.dataset.col = i;
            btn.disabled = true;
            btn.addEventListener("click", () => handleStart(i, btn));
            startRow.appendChild(btn);

            const card = document.createElement("div");
            card.className = "flavor-card-mini";
            card.innerHTML = `<img class="card-mini-img" data-col="${i}" src="${cardImgs[i]}" alt="${flavors[i]}">`;
            bottomRow.appendChild(card);
          }
        }

        function tracePathSegments(startCol) {
          const segs = [];
          let col = startCol,
            y = 0;
          for (let r = 0; r < ROWS; r++) {
            const rowY1 = r * ROW_H + ROW_H / 2;
            segs.push({ x1: colX(col), y1: y, x2: colX(col), y2: rowY1 });
            y = rowY1;
            if (rungs[r].includes(col)) {
              segs.push({ x1: colX(col), y1: y, x2: colX(col + 1), y2: y });
              col += 1;
            } else if (rungs[r].includes(col - 1)) {
              segs.push({ x1: colX(col), y1: y, x2: colX(col - 1), y2: y });
              col -= 1;
            }
          }
          segs.push({ x1: colX(col), y1: y, x2: colX(col), y2: svgH });
          return { segs, endCol: col };
        }

        function handleStart(col, btn) {
          if (!started || animating || usedStarts.has(col) || btn.disabled)
            return;
          animating = true;
          usedStarts.add(col);
          btn.disabled = true;
          btn.classList.add("used");
          resultBox.textContent = "";

          const { segs, endCol } = tracePathSegments(col);
          let i = 0;

          function step() {
            if (i >= segs.length) {
              animating = false;
              const bun = bottomRow.querySelector(
                `.card-mini-img[data-col="${endCol}"]`
              );
              bun.classList.add("winner");
              resultBox.textContent = `${col + 1}번 → ${
                flavors[endCol]
              } 당첨! 🎉`;
              return;
            }
            const s = segs[i];
            const line = document.createElementNS(
              "http://www.w3.org/2000/svg",
              "line"
            );
            line.setAttribute("x1", s.x1);
            line.setAttribute("y1", s.y1);
            line.setAttribute("x2", s.x1);
            line.setAttribute("y2", s.y1);
            line.setAttribute("class", "highlight-line");
            svg.appendChild(line);

            const duration = 110;
            const start = performance.now();
            function animate(now) {
              const t = Math.min(1, (now - start) / duration);
              line.setAttribute("x2", s.x1 + (s.x2 - s.x1) * t);
              line.setAttribute("y2", s.y1 + (s.y2 - s.y1) * t);
              if (t < 1) requestAnimationFrame(animate);
              else {
                i++;
                step();
              }
            }
            requestAnimationFrame(animate);
          }
          step();
        }

        function activateStart() {
          started = true;
          ladderBtn.textContent = "숫자를 골라보세요 ↑";
          ladderBtn.classList.add("started");
          ladderBtn.disabled = true;
          document.querySelectorAll(".start-btn-dot").forEach((b) => {
            if (!usedStarts.has(Number(b.dataset.col))) b.disabled = false;
          });
        }

        function resetAll() {
          usedStarts.clear();
          animating = false;
          started = false;
          resultBox.textContent = "";
          ladderBtn.textContent = "사다리 타기";
          ladderBtn.classList.remove("started");
          ladderBtn.disabled = false;
          generateLadder();
          drawLadder();
          buildRows();
        }

        ladderBtn.addEventListener("click", activateStart);
        reagainBtn.addEventListener("click", resetAll);

        resetAll();
      })();
    </script>
  </body>
</html>

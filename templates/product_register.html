<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이화 붕어빵 - 상품 등록</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/reg_pages.css') }}"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/product_register.css') }}">
  </head>
  <body>
    <header class="site-top">
      <div class="awning">
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
      </div>

      <div class="site-logo">
        <a href="/">
          <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="이화 붕어빵"
          />
        </a>
      </div>

      <h1 class="page-title">상품 등록</h1>

      <div class="header-icons">
        <a href="/" class="icon-btn">
          <img
            src="{{ url_for('static', filename='images/home.png') }}"
            alt="홈"
          />
        </a>
        <a href="#" class="icon-btn cart">
          <img
            src="{{ url_for('static', filename='images/cart.png') }}"
            alt="장바구니"
          />
        </a>
      </div>
    </header>

    <section>
      <p class="page-subtitle">판매할 붕어빵 정보를 입력해주세요</p>

      <div class="form-wrap">
        <form>
          <div class="four-col">
            <div class="field">
              <label
                ><span class="icon">🧑‍🍳</span>판매자 아이디<span class="req"
                  >*</span
                ></label
              >
              <input type="text" placeholder="seller_id" required />
            </div>
            <div class="field">
              <label
                ><span class="icon">🏷️</span>상품명<span class="req"
                  >*</span
                ></label
              >
              <input type="text" placeholder="예) 팥붕어빵" required />
            </div>
            <div class="field">
              <label
                ><span class="icon">💰</span>가격<span class="req"
                  >*</span
                ></label
              >
              <div class="price-row">
                <input type="number" placeholder="1500" required />
                <span class="unit">원</span>
              </div>
            </div>
            <div class="field">
              <label
                ><span class="icon">📍</span>주소<span class="req"
                  >*</span
                ></label
              >
              <input type="text" placeholder="이화여대 정문 앞" required />
            </div>
          </div>

          <div class="two-col">
            <div class="field">
              <label
                ><span class="icon">📝</span>상품 설명<span class="req"
                  >*</span
                ></label
              >
              <textarea
                placeholder="붕어빵에 대한 소개를 자유롭게 적어주세요"
              ></textarea>
            </div>
            <div class="field">
              <label
                ><span class="icon">📷</span>상품 사진<span class="req"
                  >*</span
                ></label
              >
              <div class="upload-box" id="uploadBox">
                <span class="txt">클릭해서 사진 업로드(JPG, PNG)</span>
                <input type="file" accept="image/*" id="fileInput" />
              </div>
              <img class="preview-img" id="previewImg" alt="미리보기" />
            </div>
          </div>

          <div class="status-field">
            <label class="group-label"
              ><span class="icon">📌</span>판매 상태<span class="req"
                >*</span
              ></label
            >
            <div class="status-group">
              <label class="status-pill selected">
                <input type="radio" name="status" checked /> 판매중
              </label>
              <label class="status-pill">
                <input type="radio" name="status" /> 준비중
              </label>
              <label class="status-pill">
                <input type="radio" name="status" /> 품절
              </label>
            </div>
          </div>

          <div class="action-row">
            <button type="button" class="cancel-btn">취소</button>
            <button type="submit" class="submit-btn">등록하기</button>
          </div>
          <div class="bottom-row">
            <div class="hint-row">
              🌸 등록된 상품은 상품 목록 페이지에 바로 표시됩니다
            </div>
          </div>
        </form>
      </div>
    </section>

    <footer class="site-footer">
      <p>
        <span style="color: #006b2d">문의 상담 | 이화 붕어빵 </span>02)
        1886-0531
      </p>
    </footer>

    <script>
      document.querySelectorAll(".status-pill").forEach((pill) => {
        pill.addEventListener("click", () => {
          document
            .querySelectorAll(".status-pill")
            .forEach((p) => p.classList.remove("selected"));
          pill.classList.add("selected");
          pill.querySelector("input").checked = true;
        });
      });

      const fileInput = document.getElementById("fileInput");
      const previewImg = document.getElementById("previewImg");
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            previewImg.src = e.target.result;
            previewImg.style.display = "block";
          };
          reader.readAsDataURL(file);
        }
      });

      document
        .querySelector("form")
        .addEventListener("submit", (e) => e.preventDefault());
    </script>
  </body>
</html>

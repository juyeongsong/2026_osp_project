{% extends "index.html" %} {% block section %}
<!-- 후기 목록 페이지  -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap"
/>
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/review.css') }}"
/>

<h1 class="page-title">후기 목록</h1>

<div class="review-main">
  <!-- 맛 필터 + 후기 작성 버튼 -->
  <div class="review-toolbar">
    <!-- 맛 필터 -->
    <nav class="flavor-filter" aria-label="맛별 후기 골라보기">
      <p class="flavor-filter__label">후기<br />골라보기</p>
      <button class="flavor-filter__arrow" type="button" data-dir="-1">
        <img
          src="{{ url_for('static', filename='images/review/arrow-left.svg') }}"
          alt="이전 맛"
        />
      </button>
      <ul class="flavor-filter__list">
        <li data-flavor="pat" data-name="팥">
          <a class="flavor-chip" href="/review?flavor=pat">
            <span class="sr-only">팥 붕어빵 후기만 보기</span>
            <span class="bungeo">
              <img
                class="bungeo__fish"
                src="{{ url_for('static', filename='images/review/fish.png') }}"
                alt=""
              />
              <img
                class="bungeo__filling"
                src="{{ url_for('static', filename='images/review/filling-pat.svg') }}"
                alt=""
              />
            </span>
          </a>
        </li>
        <li data-flavor="choux" data-name="슈크림">
          <a class="flavor-chip" href="/review?flavor=choux">
            <span class="sr-only">슈크림 붕어빵 후기만 보기</span>
            <span class="bungeo">
              <img
                class="bungeo__fish"
                src="{{ url_for('static', filename='images/review/fish.png') }}"
                alt=""
              />
              <img
                class="bungeo__filling"
                src="{{ url_for('static', filename='images/review/filling-choux.svg') }}"
                alt=""
              />
            </span>
          </a>
        </li>
        <li data-flavor="strawberry-choux" data-name="딸기슈크림">
          <a class="flavor-chip" href="/review?flavor=strawberry-choux">
            <span class="sr-only">딸기슈크림 붕어빵 후기만 보기</span>
            <span class="bungeo">
              <img
                class="bungeo__fish"
                src="{{ url_for('static', filename='images/review/fish.png') }}"
                alt=""
              />
              <img
                class="bungeo__filling"
                src="{{ url_for('static', filename='images/review/filling-strawberry-choux.svg') }}"
                alt=""
              />
            </span>
          </a>
        </li>
        <li data-flavor="sweetpotato" data-name="고구마">
          <a class="flavor-chip" href="/review?flavor=sweetpotato">
            <span class="sr-only">고구마 붕어빵 후기만 보기</span>
            <span class="bungeo">
              <img
                class="bungeo__fish"
                src="{{ url_for('static', filename='images/review/fish.png') }}"
                alt=""
              />
              <img
                class="bungeo__filling"
                src="{{ url_for('static', filename='images/review/filling-sweetpotato.svg') }}"
                alt=""
              />
            </span>
          </a>
        </li>
        <li data-flavor="matcha" data-name="말차">
          <a class="flavor-chip" href="/review?flavor=matcha">
            <span class="sr-only">말차 붕어빵 후기만 보기</span>
            <span class="bungeo">
              <img
                class="bungeo__fish"
                src="{{ url_for('static', filename='images/review/fish.png') }}"
                alt=""
              />
              <img
                class="bungeo__filling"
                src="{{ url_for('static', filename='images/review/filling-matcha.svg') }}"
                alt=""
              />
            </span>
          </a>
        </li>
        <li data-flavor="pizza" data-name="피자">
          <a class="flavor-chip" href="/review?flavor=pizza">
            <span class="sr-only">피자 붕어빵 후기만 보기</span>
            <span class="bungeo">
              <img
                class="bungeo__fish"
                src="{{ url_for('static', filename='images/review/fish.png') }}"
                alt=""
              />
              <img
                class="bungeo__filling"
                src="{{ url_for('static', filename='images/review/filling-pizza.svg') }}"
                alt=""
              />
            </span>
          </a>
        </li>
      </ul>
      <button class="flavor-filter__arrow" type="button" data-dir="1">
        <img
          src="{{ url_for('static', filename='images/review/arrow-right.svg') }}"
          alt="다음 맛"
        />
      </button>
    </nav>

    <a class="write-button" href="/reg_reviews">후기 작성하기</a>
  </div>

  <!-- 후기 카드 -->
  <ul class="review-list"></ul>

  <nav
    class="pagination"
    aria-label="후기 페이지"
    data-current-page="1"
    data-total-pages="1"
  >
    <a class="pagination__arrow pagination__prev" href="#"
      ><img
        src="{{ url_for('static', filename='images/review/page-prev.svg') }}"
        alt="이전 페이지"
    /></a>
    <ol class="pagination__list">
      <li>
        <a class="pagination__link is-current" href="/review?page=1">1</a>
      </li>
      <li><a class="pagination__link" href="/review?page=2">2</a></li>
      <li><a class="pagination__link" href="/review?page=3">3</a></li>
      <li><a class="pagination__link" href="/review?page=4">4</a></li>
      <li><a class="pagination__link" href="/review?page=5">5</a></li>
    </ol>
    <a class="pagination__arrow pagination__next" href="#"
      ><img
        src="{{ url_for('static', filename='images/review/page-next.svg') }}"
        alt="다음 페이지"
    /></a>
  </nav>
</div>

<script id="reviews-data" type="application/json">{{ reviews|tojson }}</script>
<script src="{{ url_for('static', filename='review.js') }}"></script>
{% endblock section %}

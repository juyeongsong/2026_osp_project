{% extends "index.html" %} {% block section %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/auth.css') }}"
/>

<h2 class="page-title">회원가입</h2>

<div class="auth-container signup-container">
  {% if error %}
  <script>
    alert("{{ error }}");
  </script>
  {% endif %}

  <form class="auth-form" action="/signup_post" method="post">
    <div class="form-group">
      <label for="id">아이디</label>
      <div class="id-check-row">
        <input type="text" id="id" name="id" required />
        <button type="button" id="id-check-btn" class="id-check-btn">
          중복 확인
        </button>
      </div>
      <p id="id-check-message"></p>
    </div>

    <div class="form-group">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" name="pw" required />
    </div>

    <div class="form-group">
      <label for="email">이메일</label>
      <input type="text" id="email" name="email" required />
    </div>

    <div class="form-group">
      <label for="phnum">휴대폰 번호(선택)</label>
      <input type="text" id="phnum" name="phnum" />
    </div>

    <input type="submit" value="회원가입" class="auth-btn" />
  </form>
</div>

<script>
  const checkButton = document.getElementById("id-check-btn");
  const idInput = document.getElementById("id");
  const message = document.getElementById("id-check-message");

  checkButton.addEventListener("click", async function () {
    const id = idInput.value.trim();

    if (id === "") {
      message.textContent = "아이디를 입력해주세요.";
      message.style.color = "red";
      return;
    }

    const formData = new FormData();
    formData.append("id", id);

    const response = await fetch("/check_id", {
      method: "POST",
      body: formData,
    });

    const result = await response.json();

    if (result.available) {
      message.textContent = "사용 가능한 아이디입니다.";
      message.style.color = "#00640f";
    } else {
      message.textContent = "이미 사용 중인 아이디입니다.";
      message.style.color = "red";
    }
  });
</script>

{% endblock section %}

{% extends "index.html" %} {% block section %}

<h2 class="page-title">회원가입</h2>

<div class="auth-container signup-container">
  {% if error %}
  <script>
    alert("{{ error }}");
  </script>
  {% endif %}

  <form class="auth-form" action="/signup_post" method="post">
    <div class="form-group">
      <label for="id">아이디</label>
      <input type="text" id="id" name="id" required />
    </div>

    <div class="form-group">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" name="pw" required />
    </div>

    <div class="form-group">
      <label for="email">이메일</label>
      <input type="text" id="email" name="email" required />
    </div>

    <div class="form-group">
      <label for="phnum">휴대폰 번호(선택)</label>
      <input type="text" id="phnum" name="phnum" />
    </div>

    <input type="submit" value="회원가입" class="auth-btn" />
  </form>
</div>

{% endblock section %}

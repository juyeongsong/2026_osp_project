<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이화 붕어빵 - 맛 선택</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/reg_pages.css') }}"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/taste_select.css') }}">
  </head>
  <body>
    <header class="site-top">
      <div class="awning">
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
        <div class="awning_piece"></div>
      </div>

      <div class="site-logo">
        <a href="/">
          <img
            src="{{ url_for('static', filename='images/logo.png') }}"
            alt="이화 붕어빵"
          />
        </a>
      </div>

      <h1 class="page-title">오늘의 붕어빵은?</h1>

      <div class="header-icons">
        <a href="/" class="icon-btn">
          <img
            src="{{ url_for('static', filename='images/home.png') }}"
            alt="홈"
          />
        </a>
        <a href="#" class="icon-btn cart">
          <img
            src="{{ url_for('static', filename='images/cart.png') }}"
            alt="장바구니"
          />
        </a>
      </div>
    </header>

    <section>
      <div class="body-area">
        <div class="lead">
          <img
            class="fish"
            src="{{ url_for('static', filename='images/fish-base.png') }}"
            alt=""
          />뭐 먹을지 고민이 될 땐, 사다리를 타보세요~
        </div>
        <div class="board-wrap">
          <div class="sub-lead-row">
            <p class="sub-lead">원하는 붕어빵 맛 6개를 선택하세요</p>
            <div class="picked-hint" id="pickedHint"></div>
          </div>
          <div class="flavor-grid" id="flavorGrid"></div>
        </div>

        <div class="action-row">
          <button class="start-btn" id="startBtn" disabled>
            사다리 타러 가기 →
          </button>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <p>
        <span style="color: #006b2d">문의 상담 | 이화 붕어빵 </span>02)
        1886-0531
      </p>
    </footer>

    <div class="toast" id="toast">사다리 타기 페이지로 이동합니다 🌸</div>

    <script>
      (function () {
        const REQUIRED = 6;
        const flavors = [
          {
            name: "초코 붕어빵",
            img: "{{ url_for('static', filename='images/card-choco.png') }}",
            default: false,
          },
          {
            name: "슈크림 붕어빵",
            img: "{{ url_for('static', filename='images/card-cream.png') }}",
            default: true,
          },
          {
            name: "딸기슈크림 붕어빵",
            img: "{{ url_for('static', filename='images/card-strawberry.png') }}",
            default: true,
          },
          {
            name: "팥 붕어빵",
            img: "{{ url_for('static', filename='images/card-red-bean.png') }}",
            default: true,
          },
          {
            name: "고구마 붕어빵",
            img: "{{ url_for('static', filename='images/card-sweet-potato.png') }}",
            default: true,
          },
          {
            name: "피자 붕어빵",
            img: "{{ url_for('static', filename='images/card-pizza.png') }}",
            default: true,
          },
          {
            name: "말차 붕어빵",
            img: "{{ url_for('static', filename='images/card-matcha.png') }}",
            default: true,
          },
        ];

        const grid = document.getElementById("flavorGrid");
        const startBtn = document.getElementById("startBtn");
        const pickedHint = document.getElementById("pickedHint");
        const toast = document.getElementById("toast");

        let pickedFlavors = new Set(
          flavors.filter((f) => f.default).map((f) => f.name)
        );

        function buildCards() {
          grid.innerHTML = "";
          flavors.forEach((f) => {
            const card = document.createElement("div");
            card.className = "flavor-card";
            card.dataset.name = f.name;
            card.innerHTML = `<img src="${f.img}" alt="${f.name}">`;
            card.style.setProperty("--mask-src", `url(${f.img})`);
            card.addEventListener("click", () => {
              if (pickedFlavors.has(f.name)) {
                pickedFlavors.delete(f.name);
              } else {
                if (pickedFlavors.size >= REQUIRED) return;
                pickedFlavors.add(f.name);
              }
              render();
            });
            grid.appendChild(card);
          });
        }


  function render() {
    document.querySelectorAll(".flavor-card").forEach(card => {
      card.classList.toggle("picked", pickedFlavors.has(card.dataset.name));
    });

    const count = pickedFlavors.size;
    startBtn.disabled = count !== REQUIRED;
    pickedHint.textContent = `(${count} / ${REQUIRED}개 선택됨)`;
  }

 startBtn.addEventListener("click", () => {
    if (startBtn.disabled) return;
    toast.classList.add("show");
    setTimeout(() => { window.location.href = "{{ url_for('view_ladder') }}"; }, 900);
  });

        buildCards();
        render();
      })();
    </script>
  </body>
</html>
